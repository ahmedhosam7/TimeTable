<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم الجدول الذكي - A1</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --online-badge: #eab308;
            --onsite-badge: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { margin: 0; color: var(--accent); font-size: 22px; }

        .main-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }
        .main-tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .main-tab-btn.active {
            background-color: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-action {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-card h3 { margin: 0 0 5px 0; color: var(--text-muted); font-size: 14px; }
        .stat-number { font-size: 26px; font-weight: bold; color: var(--accent); margin-bottom: 8px; }
        .progress-bar-container {
            background: var(--bg-color);
            border-radius: 8px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .progress-bar-fill {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.3s ease;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .sub-tabs { display: flex; gap: 8px; }
        button.tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border);
            padding: 6px 15px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button.tab-btn.active {
            background-color: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
        }

        .auto-badge {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
        }
        .day-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 5px;
        }
        .item-list { display: flex; flex-direction: column; gap: 10px; }
        .schedule-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .item-title { font-weight: bold; font-size: 14px; }
        .item-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        
        .checkboxes-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            font-size: 12px;
        }
        .checkbox-label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .checkbox-label input { width: 14px; height: 14px; cursor: pointer; }
        .chk-attendance { accent-color: var(--success); }
        .chk-sheet { accent-color: var(--warning); }
        .chk-quiz { accent-color: var(--accent); }

        .badge {
            display: inline-block;
            padding: 2px 5px;
            font-size: 9px;
            border-radius: 4px;
            margin-left: 3px;
            font-weight: bold;
        }
        .badge-lec { background-color: #3b82f6; color: white; }
        .badge-sec { background-color: #10b981; color: white; }
        .badge-mode {
            display: inline-block;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 4px;
        }
        .mode-online { background-color: var(--online-badge); color: #000; }
        .mode-onsite { background-color: var(--onsite-badge); color: #fff; }
        .btn-delete {
            background: none; border: none; color: var(--danger); cursor: pointer; float: left; font-size: 12px;
        }
        .week-section { display: none; }
        .week-section.active { display: block; }
        .empty-msg { color: var(--text-muted); font-size: 12px; text-align: center; padding: 8px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>منظم الجدول الذكي - A1</h1>
        <div class="auto-badge" id="current-week-indicator">جاري الحساب...</div>
    </header>

    <div class="main-tabs">
        <button class="main-tab-btn active" onclick="switchMainView('progress')">📊 مستوى التقدم</button>
        <button class="main-tab-btn" onclick="switchMainView('schedule')">📅 الجدول وإضافته</button>
    </div>

    <!-- 1. مستوى التقدم -->
    <div id="view-progress" class="view-section active">
        <div class="progress-grid">
            <div class="stat-card">
                <h3>نسبة الحضور</h3>
                <div class="stat-number" id="stat-att-num">0%</div>
                <div class="progress-bar-container"><div class="progress-bar-fill" id="bar-att"></div></div>
            </div>
            <div class="stat-card">
                <h3>الشيتات المنجزة</h3>
                <div class="stat-number" id="stat-sheet-num">0%</div>
                <div class="progress-bar-container"><div class="progress-bar-fill" id="bar-sheet" style="background-color: var(--warning);"></div></div>
            </div>
            <div class="stat-card">
                <h3>الكويزات المجتازة</h3>
                <div class="stat-number" id="stat-quiz-num">0%</div>
                <div class="progress-bar-container"><div class="progress-bar-fill" id="bar-quiz" style="background-color: var(--accent);"></div></div>
            </div>
        </div>
    </div>

    <!-- 2. الجدول وإضافته -->
    <div id="view-schedule" class="view-section">
        <div class="form-card">
            <h3 style="margin-top: 0; color: var(--accent); font-size: 15px;">➕ إضافة محاضرة أو سكشن جديد</h3>
            <form onsubmit="addNewItem(event)">
                <div class="form-grid">
                    <input type="text" id="item-title" placeholder="اسم المادة" required>
                    <select id="item-day">
                        <option value="السبت">السبت</option>
                        <option value="الأحد">الأحد</option>
                        <option value="الإثنين">الإثنين</option>
                        <option value="الثلاثاء">الثلاثاء</option>
                        <option value="الأربعاء">الأربعاء</option>
                        <option value="الخميس">الخميس</option>
                    </select>
                    <select id="item-week">
                        <option value="odd">الأسبوع الفردي</option>
                        <option value="even">الأسبوع الزوجي</option>
                    </select>
                    <select id="item-type">
                        <option value="محاضرة">محاضرة</option>
                        <option value="سكشن">سكشن</option>
                    </select>
                    <select id="item-mode">
                        <option value="onsite">🏛️ حضور</option>
                        <option value="online">💻 أونلاين</option>
                    </select>
                    <input type="text" id="item-time" placeholder="الموعد (مثال: 9ص - 11ص)" required>
                    <input type="text" id="item-place" placeholder="المكان / المحاضر" required>
                </div>
                <button type="submit" class="btn-action">حفظ وإضافة</button>
            </form>
        </div>

        <div class="controls">
            <div class="sub-tabs">
                <button class="tab-btn active" onclick="switchWeek('odd')">الأسبوع الفردي</button>
                <button class="tab-btn" onclick="switchWeek('even')">الأسبوع الزوجي</button>
            </div>
        </div>

        <div id="odd-week" class="week-section active">
            <div class="grid-layout" id="odd-container"></div>
        </div>
        <div id="even-week" class="week-section">
            <div class="grid-layout" id="even-container"></div>
        </div>
    </div>
</div>

<script>
    const daysOrder = ["السبت", "الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
    
    let scheduleItems = [];
    let userStates = {};

    try {
        scheduleItems = JSON.parse(localStorage.getItem('myCustomSchedule')) || [];
        userStates = JSON.parse(localStorage.getItem('myCustomStates')) || {};
    } catch(e) {
        scheduleItems = [];
        userStates = {};
    }

    function checkAndResetCycle() {
        try {
            const startDate = new Date('2026-10-04');
            const now = new Date();
            const diffTime = Math.abs(now - startDate);
            const currentWeekNum = Math.ceil(Math.ceil(diffTime / (1000 * 60 * 60 * 24)) / 7);
            
            const lastSavedWeek = localStorage.getItem('lastCycleWeek') || 0;
            if (currentWeekNum !== parseInt(lastSavedWeek)) {
                userStates = {};
                localStorage.setItem('myCustomStates', JSON.stringify(userStates));
                localStorage.setItem('lastCycleWeek', currentWeekNum);
            }

            const isOdd = currentWeekNum % 2 !== 0;
            const indicator = document.getElementById('current-week-indicator');
            if(indicator) {
                indicator.textContent = `الأسبوع: ${isOdd ? 'فردي (1)' : 'زوجي (2)'}`;
            }
        } catch(err) {
            console.log(err);
        }
    }

    function addNewItem(event) {
        event.preventDefault();
        const newItem = {
            id: 'item_' + Date.now(),
            title: document.getElementById('item-title').value,
            day: document.getElementById('item-day').value,
            weekType: document.getElementById('item-week').value,
            type: document.getElementById('item-type').value,
            mode: document.getElementById('item-mode').value,
            time: document.getElementById('item-time').value,
            place: document.getElementById('item-place').value
        };

        scheduleItems.push(newItem);
        localStorage.setItem('myCustomSchedule', JSON.stringify(scheduleItems));
        
        event.target.reset();
        renderSchedule('odd');
        renderSchedule('even');
        updateProgressStats();
        alert('تمت الإضافة بنجاح!');
    }

    function deleteItem(id) {
        if (confirm('هل تريد الحذف؟')) {
            scheduleItems = scheduleItems.filter(i => i.id !== id);
            localStorage.setItem('myCustomSchedule', JSON.stringify(scheduleItems));
            renderSchedule('odd');
            renderSchedule('even');
            updateProgressStats();
        }
    }

    function updateStatus(id, field) {
        if (!userStates[id]) userStates[id] = { att: false, sheet: false, quiz: false };
        userStates[id][field] = !userStates[id][field];
        localStorage.setItem('myCustomStates', JSON.stringify(userStates));
        renderSchedule('odd');
        renderSchedule('even');
        updateProgressStats();
    }

    function switchMainView(viewName) {
        document.getElementById('view-progress').classList.toggle('active', viewName === 'progress');
        document.getElementById('view-schedule').classList.toggle('active', viewName === 'schedule');
        document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.toggle('active', btn.textContent.includes(viewName === 'progress' ? 'مستوى التقدم' : 'الجدول')));
        if (viewName === 'progress') updateProgressStats();
    }

    function updateProgressStats() {
        const totalItems = scheduleItems.length;
        if (totalItems === 0) {
            document.getElementById('stat-att-num').textContent = '0%';
            document.getElementById('bar-att').style.width = '0%';
            document.getElementById('stat-sheet-num').textContent = '0%';
            document.getElementById('bar-sheet').style.width = '0%';
            document.getElementById('stat-quiz-num').textContent = '0%';
            document.getElementById('bar-quiz').style.width = '0%';
            return;
        }

        let attCount = 0, sheetCount = 0, quizCount = 0;
        scheduleItems.forEach(item => {
            const st = userStates[item.id] || { att: false, sheet: false, quiz: false };
            if (st.att) attCount++;
            if (st.sheet) sheetCount++;
            if (st.quiz) quizCount++;
        });

        const attPct = Math.round((attCount / totalItems) * 100);
        const sheetPct = Math.round((sheetCount / totalItems) * 100);
        const quizPct = Math.round((quizCount / totalItems) * 100);

        document.getElementById('stat-att-num').textContent = attPct + '%';
        document.getElementById('bar-att').style.width = attPct + '%';
        document.getElementById('stat-sheet-num').textContent = sheetPct + '%';
        document.getElementById('bar-sheet').style.width = sheetPct + '%';
        document.getElementById('stat-quiz-num').textContent = quizPct + '%';
        document.getElementById('bar-quiz').style.width = quizPct + '%';
    }

    function renderSchedule(week) {
        const containerId = week === 'odd' ? 'odd-container' : 'even-container';
        const container = document.getElementById(containerId);
        if(!container) return;
        container.innerHTML = "";

        daysOrder.forEach(dayName => {
            const dayItems = scheduleItems.filter(item => item.day === dayName && item.weekType === week);
            const card = document.createElement('div');
            card.className = 'day-card';

            let itemsHtml = '';
            if (dayItems.length === 0) {
                itemsHtml = `<div class="empty-msg">لا توجد محاضرات</div>`;
            } else {
                dayItems.forEach(item => {
                    const st = userStates[item.id] || { att: false, sheet: false, quiz: false };
                    const badgeClass = item.type === 'محاضرة' ? 'badge-lec' : 'badge-sec';
                    const modeBadge = item.mode === 'online' 
                        ? `<span class="badge-mode mode-online">💻 أونلاين</span>` 
                        : `<span class="badge-mode mode-onsite">🏛️ حضور</span>`;

                    itemsHtml += `
                        <div class="schedule-item">
                            <button class="btn-delete" onclick="deleteItem('${item.id}')">حذف</button>
                            <div class="item-title">${item.title} <span class="badge ${badgeClass}">${item.type}</span> ${modeBadge}</div>
                            <div class="item-meta">⏰ ${item.time} | 📍 ${item.place}</div>
                            <div class="checkboxes-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" class="chk-attendance" ${st.att ? 'checked' : ''} onchange="updateStatus('${item.id}', 'att')"> حضور
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" class="chk-sheet" ${st.sheet ? 'checked' : ''} onchange="updateStatus('${item.id}', 'sheet')"> شيت
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" class="chk-quiz" ${st.quiz ? 'checked' : ''} onchange="updateStatus('${item.id}', 'quiz')"> كويز
                                </label>
                            </div>
                        </div>
                    `;
                });
            }
            card.innerHTML = `<div class="day-title">${dayName}</div><div class="item-list">${itemsHtml}</div>`;
            container.appendChild(card);
        });
    }

    function switchWeek(weekType) {
        document.getElementById('odd-week').classList.toggle('active', weekType === 'odd');
        document.getElementById('even-week').classList.toggle('active', weekType === 'even');
        document.querySelectorAll('.sub-tabs .tab-btn').forEach(btn => btn.classList.toggle('active', btn.textContent.includes(weekType === 'odd' ? 'فردي' : 'زوجي')));
    }

    checkAndResetCycle();
    renderSchedule('odd');
    renderSchedule('even');
    updateProgressStats();
</script>

</body>
</html>
